<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ray Kaynak Hesabı</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1240e0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* VOICE: saha aracı, sade, tek ekranda
   IDEA: ölçü föyü — her satır bir conta, Sol / Sağ yan yana sütunlar
   PICTURE: sıralı conta tablosu, toplamlar sarı hücrede
   COLOUR and TYPE: kobalt şerit, beyaz zemin, sinyal sarısı; sistem yazı tipi
   LAYOUT: ince ayar şeridi, tablo, altta ekle/kopyala */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b0f1a,#e8ecf7);--mut:light-dark(#566079,#9aa5c0);
--zone:light-dark(#eef2ff,#141a2e);--line:light-dark(#d4dbf0,#263055);--cob:#1240e0;--acc:#ffc400;--lnk:light-dark(#1240e0,#8fa8ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
header{background:var(--cob);color:#fff;padding:10px 12px;font-weight:700;font-size:19px}
main{max-width:720px;margin:0 auto;padding:8px 6px 30px}
.set{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--zone);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.set input{width:54px}
.grp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tip b{background:var(--acc);color:#111;padding:1px 6px;border-radius:5px;white-space:nowrap}
input{border:1.5px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:600 16px system-ui,sans-serif;height:40px;width:100%;text-align:center;padding:0 2px}
input:focus{outline:2px solid var(--cob);border-color:var(--cob)}
input.kr.on{color:#fff;background:#1240e0;border-color:#1240e0;font-weight:800}
input::placeholder{color:var(--mut);opacity:.6}
table{width:100%;border-collapse:collapse;margin-top:8px;table-layout:fixed}
th{font-size:12px;color:var(--mut);font-weight:600;padding:3px 1px}
th.g{font-size:14px;color:var(--ink);font-weight:800;border-bottom:2px solid var(--ink)}
td{padding:3px 2px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
td.n{font-weight:800;font-size:15px}
td.t{background:var(--acc);color:#111;font-weight:800;font-size:16px;white-space:nowrap;border-radius:6px;line-height:1.15}
td.t .cm{color:#c4120a;font-size:18px}
td.t small{display:block;font-size:11px;font-weight:600}
.sep{border-left:2px solid var(--ink)}
tfoot td{border-bottom:0;padding-top:8px}
.gl{font-weight:800;font-size:13px;text-align:right;padding-right:6px}
.gt{background:#d7261e;color:#fff;font-weight:800;font-size:16px;border-radius:6px;white-space:nowrap;padding:8px 2px}
.x{background:none;border:0;color:var(--mut);font-size:20px;width:100%;height:40px;cursor:pointer}
col.cn{width:26px}col.cx{width:26px}col.ct{width:17%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar button{font:600 15px system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--cob);background:var(--cob);color:#fff;cursor:pointer}
.bar button.o{background:none;color:var(--lnk);border-color:var(--lnk)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{font-size:14px;color:var(--mut)}
.f{font-size:13px;color:var(--mut);margin-top:12px}
</style>
</head>
<body>
<header>Ray Kaynak Hesabı</header>
<main>
<div class="set">
<span class="grp"><label for="yp">Eritme</label><input id="yp" type="number" inputmode="decimal" value="3"><span>cm</span></span>
<span class="grp"><label for="tr">Travers arası</label><input id="tr" type="number" inputmode="decimal" placeholder="44"><span>cm</span></span>
<span class="tip" id="tip"></span>
</div>

<table>
<colgroup><col class="cn"><col><col><col class="ct"><col><col><col class="ct"><col class="cx"></colgroup>
<thead>
<tr><th></th><th class="g" colspan="3">Sol Ray</th><th class="g sep" colspan="3">Sağ Ray</th><th></th></tr>
<tr><th>#</th><th>Boşluk</th><th>Kesilen</th><th>Toplam</th><th class="sep">Boşluk</th><th>Kesilen</th><th>Toplam</th><th></th></tr>
</thead>
<tbody id="list"></tbody>
<tfoot><tr><td colspan="3" class="gl">Genel Toplam</td><td class="gt" id="gsol">—</td><td colspan="2" class="gl sep">Genel Toplam</td><td class="gt" id="gsag">—</td><td></td></tr></tfoot>
</table>

<div class="bar">
<button id="add">+ Conta ekle</button>
<button class="o" id="copy">Kopyala</button>
<button class="o" id="clr">Hepsini sil</button>
<span id="msg" role="status"></span>
</div>
<p class="f"><b>Toplam</b> = Conta 1'den o contaya kadar (boşluk + kesilen + eritme) toplamı. Altındaki küçük sayı sadece o contanın değeri. Kaynak arka rayın ucunda oluşur.</p>
</main>
<script>
{
const $=id=>document.getElementById(id);
const K='rayKaynakConta';
const blank=()=>({sol:{cb:'',kr:''},sag:{cb:'',kr:''}});
let rows=[];
try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){rows=d.rows||[];if(d.yp!=null)$('yp').value=d.yp;if(d.tr!=null)$('tr').value=d.tr}}catch(e){}
if(!rows.length) rows=[blank(),blank(),blank()];
const n=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const f=v=>`${Math.round(v*10)/10}`.replace('.',',');
const yp=()=>n($('yp').value);
const res=s=>(s.cb===''&&s.kr==='')?null:n(s.cb)+n(s.kr)+yp();
const cum=(i,k)=>{let t=0;for(let j=0;j<=i;j++){const r=res(rows[j][k]);if(r!=null)t+=r}return t};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inp=(i,k,fl,cls='')=>`<td class="${cls}"><input class="${fl==='kr'?'kr'+(n(rows[i][k].kr)>0?' on':''):''}" id="c${i}${k}${fl}" data-i="${i}" data-k="${k}" data-f="${fl}" type="number" inputmode="decimal" placeholder="0" value="${esc(rows[i][k][fl])}" aria-label="Conta ${i+1} ${k==='sol'?'Sol':'Sağ'} ${fl==='cb'?'boşluk':'kesilen'}"></td>`;

function draw(){
  $('list').innerHTML=rows.map((_,i)=>`<tr>
<td class="n">${i+1}</td>
${inp(i,'sol','cb')}${inp(i,'sol','kr')}<td class="t" id="r${i}sol"></td>
${inp(i,'sag','cb','sep')}${inp(i,'sag','kr')}<td class="t" id="r${i}sag"></td>
<td><button class="x" data-del="${i}" aria-label="Conta ${i+1} sil">×</button></td></tr>`).join('');
  upd();
}
function upd(){rows.forEach((row,i)=>['sol','sag'].forEach(k=>{const r=res(row[k]);$('r'+i+k).innerHTML=r==null?'—':`<span class="cm">${f(cum(i,k))}</span>${i?`<small>+${f(r)}</small>`:''}`}));['sol','sag'].forEach(k=>{const any=rows.some(r=>res(r[k])!=null);$('g'+k).textContent=any?f(cum(rows.length-1,k))+' cm':'—'})}
function tip(){const c=n($('tr').value);$('tip').innerHTML=c>0?`Arka ray ucu traversten <b>${f(c/2)} cm</b>`:''}
let dbDoc=null,dbT=null;
function save(){const st={yp:$('yp').value,tr:$('tr').value,rows};try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}
  if(dbDoc){clearTimeout(dbT);dbT=setTimeout(()=>{dbDoc.set({json:JSON.stringify(st),t:Date.now()}).catch(()=>{})},700)}}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const doc=db.collection('data/users/'+id).doc('ray-kaynak');
  const snap=await doc.get();
  const d=snap?(typeof snap.data==='function'?snap.data():(snap.data&&snap.data.json?snap.data:snap)):null;
  if(d&&d.json){const st=JSON.parse(d.json);if(Array.isArray(st.rows)&&st.rows.length){rows=st.rows;if(st.yp!=null)$('yp').value=st.yp;if(st.tr!=null)$('tr').value=st.tr;draw();tip();try{localStorage.setItem(K,d.json)}catch(e){}}}
  dbDoc=doc;
  if(!(d&&d.json))save();
  $('msg').textContent='Kayıt açık';
}catch(e){}})();

$('list').addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;rows[t.dataset.i][t.dataset.k][t.dataset.f]=t.value;if(t.dataset.f==='kr')t.classList.toggle('on',n(t.value)>0);upd();save()});
$('list').addEventListener('click',e=>{const d=e.target.dataset.del;if(d==null)return;
  const b=e.target;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='?';b.style.color='#c0261b';setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent='×';b.style.color=''}},2500);return}
  rows.splice(+d,1);if(!rows.length)rows=[blank()];draw();save();$('msg').textContent='Conta silindi'});
$('yp').addEventListener('input',()=>{upd();save()});
$('tr').addEventListener('input',()=>{tip();save()});
$('add').addEventListener('click',()=>{rows.push(blank());draw();save();$('c'+(rows.length-1)+'solcb').focus();$('msg').textContent=''});
$('clr').addEventListener('click',()=>{const b=$('clr');if(b.dataset.ok){rows=[blank(),blank(),blank()];draw();save();b.textContent='Hepsini sil';delete b.dataset.ok;$('msg').textContent='Liste temizlendi'}else{b.dataset.ok=1;b.textContent='Emin misiniz? Tekrar basın'}});
$('copy').addEventListener('click',async()=>{
  const p=(row,i,k)=>{const r=res(row[k]);return r==null?'—':`${f(r)} (toplam ${f(cum(i,k))})`};
  const t=rows.map((row,i)=>`Conta ${i+1}: Sol ${p(row,i,'sol')} | Sağ ${p(row,i,'sag')}`).join('\n')+`\nGENEL TOPLAM: Sol ${f(cum(rows.length-1,'sol'))} cm | Sağ ${f(cum(rows.length-1,'sag'))} cm`;
  const c=n($('tr').value);
  try{await navigator.clipboard.writeText(`Eritme: ${f(yp())} cm`+(c>0?` | Arka ray ucu traversten ${f(c/2)} cm`:'')+'\n'+t);$('msg').textContent='Kopyalandı'}catch(e){$('msg').textContent='Kopyalanamadı'}
});
draw();tip();
}
</script>
<script>
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
